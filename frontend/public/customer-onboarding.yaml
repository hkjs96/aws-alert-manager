AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Alarm Manager - customer account onboarding stack.
  Creates (1) an IAM Role that lets the central (monitoring) account use STS
  AssumeRole to read this account's resources and manage CloudWatch alarms
  (tag-based), and (2) an EventBridge rule + role that forwards this account's
  CloudWatch alarm events to the central alert event bus (alert pipeline D1).
  No heavy resources (Lambda/DB) are created - lightweight onboarding.
  Deploy this stack in the region where your CloudWatch alarms live (the same
  region as your monitored resources), so the forwarding rule can see them.

Parameters:
  CentralAccountId:
    Type: String
    AllowedPattern: "^[0-9]{12}$"
    Description: Central (monitoring) account ID. Only this account may AssumeRole the role below.

  RoleName:
    Type: String
    Default: AlarmManagerMonitoringRole
    Description: Name of the IAM Role to create. After creation, use the RoleArn output to register this account in the app.

  CentralAlertBusArn:
    Type: String
    AllowedPattern: "^arn:aws:events:[a-z0-9-]+:[0-9]{12}:event-bus/.+$"
    Description: >
      ARN of the central alert event bus that receives this account's CloudWatch alarm
      events. No default on purpose: a wrong or non-existent bus makes EventBridge drop
      every forwarded event silently. Take this value from the Alarm Manager help page.

  CreateSharedRoles:
    Type: String
    Default: "yes"
    AllowedValues: ["yes", "no"]
    Description: >
      IAM roles are global, so create them once. Use "yes" for the first region you deploy
      this stack in. For additional regions (alarms live in more than one region), use "no"
      and supply ExistingAlertForwardRoleArn - that deploys only the regional forwarding rule.

  ExistingAlertForwardRoleArn:
    Type: String
    Default: ""
    Description: >
      Required when CreateSharedRoles is "no": the AlertForwardRoleArn output from the
      first region's stack.

Conditions:
  # IAM은 글로벌이라 역할은 한 번만 만든다. 두 번째 리전 스택은 룰만 배포한다.
  CreateRoles: !Equals [!Ref CreateSharedRoles, "yes"]

Resources:
  MonitoringRole:
    Type: AWS::IAM::Role
    Condition: CreateRoles
    Properties:
      RoleName: !Ref RoleName
      # Trust policy: the central account can AssumeRole.
      # Note: the central handler does not pass an ExternalId, so it is not
      # required here. (Enforcing ExternalId would require changing the central
      # assume_role call first.)
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${CentralAccountId}:root"
            Action: sts:AssumeRole
      Policies:
        - PolicyName: AlarmManagerMonitoringAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # 1) CloudWatch alarm CRUD + metrics + tags
              #    - GetMetricStatistics: daily 메트릭 점검 (누락 시 크로스어카운트 점검이 AccessDenied)
              #    - GetMetricData: 주간 메트릭 스냅샷 + 배치 메트릭 조회
              - Effect: Allow
                Action:
                  - cloudwatch:DescribeAlarms
                  - cloudwatch:ListTagsForResource
                  - cloudwatch:PutMetricAlarm
                  - cloudwatch:DeleteAlarms
                  - cloudwatch:TagResource
                  - cloudwatch:ListMetrics
                  - cloudwatch:GetMetricStatistics
                  - cloudwatch:GetMetricData
                Resource: "*"
              # 1-1) Resource Groups Tagging API: Monitoring=on 리소스 태그 일괄 조회
              - Effect: Allow
                Action:
                  - tag:GetResources
                Resource: "*"
              # 2) Resource discovery (read) - describe/list + tag reads for the 29 supported services
              - Effect: Allow
                Action:
                  - ec2:DescribeInstances
                  - ec2:DescribeTags
                  - ec2:DescribeNatGateways
                  - ec2:DescribeVpnConnections
                  - rds:DescribeDBInstances
                  - rds:ListTagsForResource
                  - elasticloadbalancing:DescribeLoadBalancers
                  - elasticloadbalancing:DescribeTargetGroups
                  - elasticloadbalancing:DescribeTags
                  - lambda:ListFunctions
                  - lambda:ListTags
                  - s3:ListAllMyBuckets
                  - s3:GetBucketLocation
                  - s3:GetBucketTagging
                  - elasticache:DescribeCacheClusters
                  - elasticache:ListTagsForResource
                  - sqs:ListQueues
                  - sqs:ListQueueTags
                  - dynamodb:ListTables
                  - dynamodb:DescribeTable
                  - dynamodb:ListTagsOfResource
                  - elasticfilesystem:DescribeFileSystems
                  - ecs:ListClusters
                  - ecs:ListServices
                  - ecs:DescribeServices
                  - ecs:ListTagsForResource
                  - es:ListDomainNames
                  - es:DescribeDomains
                  - es:ListTags
                  - apigateway:GET
                  - acm:ListCertificates
                  - acm:DescribeCertificate
                  - backup:ListBackupVaults
                  - backup:ListTags
                  - mq:ListBrokers
                  - mq:DescribeBroker
                  - kafka:ListClustersV2
                  - wafv2:ListWebACLs
                  - wafv2:ListTagsForResource
                  - directconnect:DescribeConnections
                  - directconnect:DescribeTags
                  - sagemaker:ListEndpoints
                  - sagemaker:ListTags
                  - sns:ListTopics
                  - sns:ListTagsForResource
                  - cloudfront:ListDistributions
                  - cloudfront:ListTagsForResource
                  - route53:ListHealthChecks
                  - route53:ListTagsForResource
                Resource: "*"
              # 3) Monitoring toggle (tag write) - per-service tag-write permissions that the
              #    Resource Groups Tagging API delegates. (Governance AP-19: a missing one makes
              #    the toggle permanently AccessDenied.)
              - Effect: Allow
                Action:
                  - tag:TagResources
                  - ec2:CreateTags
                  - rds:AddTagsToResource
                  - elasticache:AddTagsToResource
                  - lambda:TagResource
                  - s3:PutBucketTagging
                  - elasticloadbalancing:AddTags
                  - sqs:TagQueue
                  - dynamodb:TagResource
                  - elasticfilesystem:TagResource
                  - es:AddTags
                  - ecs:TagResource
                  - acm:AddTagsToCertificate
                  - backup:TagResource
                  - mq:CreateTags
                  - kafka:TagResource
                  - wafv2:TagResource
                  - directconnect:TagResource
                  - sagemaker:AddTags
                  - sns:TagResource
                  - cloudfront:TagResource
                  - route53:ChangeTagsForResource
                Resource: "*"
      Tags:
        - Key: ManagedBy
          Value: AlarmManager

  # ── Alert forwarding: this account's CloudWatch alarm events → central alert bus ──
  # One rule covers every alarm regardless of count (EventBridge bus-to-bus, alert pipeline D1).
  # Cross-account PutEvents also needs the central bus to allow this account as a principal;
  # the app grants that automatically when you register the account (events:PutPermission).
  AlertForwardRole:
    Type: AWS::IAM::Role
    Condition: CreateRoles
    Properties:
      RoleName: !Sub "${RoleName}-AlertForward"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ForwardToCentralAlertBus
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: events:PutEvents
                Resource: !Ref CentralAlertBusArn
      Tags:
        - Key: ManagedBy
          Value: AlarmManager

  AlertForwardRule:
    Type: AWS::Events::Rule
    Properties:
      Name: alarm-manager-forward-to-central
      Description: Forward CloudWatch alarm state and configuration changes to the central alert bus.
      State: ENABLED
      # 알람 이벤트만 보낸다. 중앙 버스 정책도 같은 범위로 제한되어 있어, 넓히면 거부된다.
      EventPattern:
        source:
          - aws.cloudwatch
        detail-type:
          - CloudWatch Alarm State Change
          - CloudWatch Alarm Configuration Change
      Targets:
        - Id: central-alert-bus
          Arn: !Ref CentralAlertBusArn
          RoleArn: !If
            - CreateRoles
            - !GetAtt AlertForwardRole.Arn
            - !Ref ExistingAlertForwardRoleArn

Outputs:
  RoleArn:
    Condition: CreateRoles
    Description: Role ARN to use when registering this account (account_id, role_arn) in the app.
    Value: !GetAtt MonitoringRole.Arn

  AlertForwardRoleArn:
    Condition: CreateRoles
    Description: >
      Role that lets EventBridge forward this account's alarm events to the central bus.
      Pass this as ExistingAlertForwardRoleArn when deploying this stack in another region.
    Value: !GetAtt AlertForwardRole.Arn
